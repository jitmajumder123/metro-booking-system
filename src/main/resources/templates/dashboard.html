<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Metro Booking System</title>
    <link rel="stylesheet" th:href="@{/css/style.css(v='final3')}">
</head>
<body>
<nav class="nav">
    <a class="brand" th:href="@{/}">
        <span>Metro Booking</span>
    </a>
    <div class="nav-links">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/routes}">Routes</a>
        <a class="active" th:href="@{/dashboard}">Dashboard</a>
        <a th:if="${user.role == 'ADMIN'}" th:href="@{/admin}">Admin</a>
    </div>
    <div class="nav-actions">

    </div>
</nav>

<main class="container">


   
    <section class="dashboard-grid">
        <form id="recharge-card" class="panel action-panel" th:action="@{/smartcard/recharge}" method="post">
            <h2>Recharge Smart Card</h2>
            <label>Amount
                <input name="amount" type="number" min="1" step="1" placeholder="Enter amount" required>
            </label>
            <button class="btn full" type="submit">Recharge</button>
        </form>

        <section class="panel action-panel">
            <h2>Quick Actions</h2>
            <div class="stack-actions">
                <a class="btn full" th:href="@{/routes}">Search Route &amp; Book Ticket</a>
                <a class="btn secondary full" th:href="@{/dashboard#ticket-history}">View Ticket History</a>
                <a class="btn secondary full" th:if="${user.role == 'ADMIN'}" th:href="@{/admin}">Open Admin Panel</a>
            </div>
        </section>
    </section>

   
                <small th:text="'Rs. ' + ${ticket.fare}">Rs. 70</small>
            </div>
        </div>
    </section>
</main>
</body>
</html>
